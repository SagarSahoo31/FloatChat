services:
  - type: web
    name: floatchat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MPLBACKEND
        value: Agg
      - key: GEMINI_API_KEY
        sync: false   # Set manually in Render dashboard – optional
    healthCheckPath: /api/status
    autoDeploy: true
